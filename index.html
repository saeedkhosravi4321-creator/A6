  const map = {0:"۰",1:"۱",2:"۲",3:"۳",4:"۴",5:"۵",6:"۶",7:"۷",8:"۸",9:"۹"};

function RulerDivider() {
  return <div style={{ height:6, backgroundImage:`repeating-linear-gradient(90deg, ${COLORS.blueprint} 0 1px, transparent 1px 8px)`, opacity:0.35 }}/>;
}
function Card({ children, style }) {
  return <div style={{ background:"#fff", border:`1px solid ${COLORS.border}`, borderRadius:8, padding:14, ...style }}>{children}</div>;
}
function SectionTitle({ icon, children }) {
  return <div style={{ fontSize:13, fontWeight:700, marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>{icon}{children}</div>;
}
function BarRow({ name, progress }) {
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:COLORS.ink, marginBottom:4 }}>
        <span>{name}</span><span style={{ color:COLORS.blueprint, fontWeight:700 }}>{fmtPercent(progress)}</span>
      </div>
      <div style={{ height:9, background:COLORS.paper, borderRadius:5, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${progress||0}%`, background:COLORS.blueprint, borderRadius:5 }}/>
      </div>
    </div>
  );
}

/* Static comments list — Claude adds new entries here on each update.
   A viewer who wants to leave feedback is pointed to FEEDBACK_CONTACT. */
function CommentsSection({ sectionKey }) {
  const [open, setOpen] = useState(false);
  const comments = SEED_COMMENTS[sectionKey] || [];
  return (
    <div style={{ borderTop:`1px solid ${COLORS.border}`, marginTop:10, paddingTop:10 }}>
      <button onClick={()=>setOpen(o=>!o)}
        style={{ display:"flex", alignItems:"center", justifyContent:"space-between", width:"100%", background:"none", border:"none", padding:0, cursor:"pointer", color:COLORS.slate, fontSize:12 }}>
        <span style={{ display:"flex", alignItems:"center", gap:5 }}><IconMessage size={13}/>نظرات ({toPersianDigits(comments.length)})</span>
        {open ? <IconChevronUp size={14}/> : <IconChevronDown size={14}/>}
      </button>
      {open && (
        <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:8 }}>
          {comments.length === 0 && <div style={{ fontSize:11.5, color:COLORS.slateLight }}>هنوز نظری ثبت نشده</div>}
          {comments.map((c,i) => (
            <div key={i} style={{ background:COLORS.paper, borderRadius:6, padding:"6px 9px" }}>
              <div style={{ fontSize:10.5, color:COLORS.slate, marginBottom:2 }}>{c.author} · {c.date}</div>
              <div style={{ fontSize:12.5, color:COLORS.ink }}>{c.text}</div>
            </div>
          ))}
          <div style={{ fontSize:10.5, color:COLORS.slateLight }}>
            برای ثبت نظر جدید: {FEEDBACK_CONTACT}
          </div>
        </div>
      )}
    </div>
  );
}

        return (
          <Card key={r.sheet} style={{ padding:0, overflow:"hidden" }}>
            <button onClick={()=>setExpanded(isOpen?null:r.sheet)}
              style={{ width:"100%", display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 14px", background:"none", border:"none", cursor:"pointer", textAlign:"right" }}>
              <div>
                <div style={{ fontSize:13, fontWeight:700 }}>{r.dateJalali} <span style={{ fontWeight:400, color:COLORS.slate, fontSize:11.5 }}>({r.weekday})</span></div>
                <div style={{ fontSize:11, color:COLORS.slate, marginTop:2 }}>
                  شماره گزارش {toPersianDigits(r.reportNo)} · نفرات: {toPersianDigits(r.manpower.execPresent + r.manpower.staffPresent)}
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                {r.issues.length > 0 && <span style={{ fontSize:10.5, color:COLORS.amber, border:`1px solid ${COLORS.amber}`, borderRadius:4, padding:"1px 6px" }}>{toPersianDigits(r.issues.length)} مانع</span>}
                {isOpen ? <IconChevronUp size={16} color={COLORS.slate}/> : <IconChevronDown size={16} color={COLORS.slate}/>}
              </div>
            </button>
            {isOpen && (
              <div style={{ padding:"0 14px 14px" }}>
                <div style={{ display:"flex", gap:16, fontSize:12, color:COLORS.ink, marginBottom:10, flexWrap:"wrap" }}>
                  <span>وضعیت کارگاه: {r.siteStatus}</span>
                  <span>هوا: {r.weatherStatus}</span>
                  <span>دما: {toPersianDigits(r.minTemp)}–{toPersianDigits(r.maxTemp)}°</span>
                </div>
                <div style={{ fontSize:12, color:COLORS.ink, marginBottom:10 }}>
                  نیروی اجرایی: {toPersianDigits(r.manpower.execPresent)}/{toPersianDigits(r.manpower.execTotal)} حاضر ·
                  {" "}نیروی ستادی: {toPersianDigits(r.manpower.staffPresent)}/{toPersianDigits(r.manpower.staffTotal)} حاضر
                </div>
                {r.activities.length > 0 && (
                  <div style={{ marginBottom:10 }}>
                    <div style={{ fontSize:11.5, fontWeight:700, color:COLORS.slate, marginBottom:5 }}>فعالیت‌های انجام‌شده</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                      {r.activities.map((a,i) => (
                        <div key={i} style={{ fontSize:12, color:COLORS.ink, display:"flex", justifyContent:"space-between", gap:8 }}>
                          <span>{a.desc}</span>
                          {a.unit && <span style={{ color:COLORS.blueprint, whiteSpace:"nowrap", fontSize:11 }}>{toPersianDigits((a.qtyDay||0)+(a.qtyNight||0))} {a.unit}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {r.issues.length > 0 && (
                  <div style={{ marginBottom:4 }}>
                    <div style={{ fontSize:11.5, fontWeight:700, color:COLORS.amber, marginBottom:5 }}>موانع و مشکلات</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                      {r.issues.map((iss,i) => <div key={i} style={{ fontSize:12, color:COLORS.ink }}>• {iss}</div>)}
                    </div>
                  </div>
                )}
                <CommentsSection sectionKey={`daily:${r.sheet}`}/>
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

function WeeklyTab() {
  const list = SEED_WEEKLY;
  if (list.length === 0) return <Card><div style={{ textAlign:"center", color:COLORS.slate, fontSize:13, padding:"20px 0" }}>هنوز گزارش هفتگی ثبت نشده</div></Card>;
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      {list.map(w => (
        <Card key={w.reportNo}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:700 }}>گزارش هفتگی شماره {toPersianDigits(w.reportNo)}</div>
              <div style={{ fontSize:11.5, color:COLORS.slate, marginTop:2 }}>دوره: {w.periodFrom} تا {w.periodTo}</div>
            </div>
            <span style={{ fontSize:16, fontWeight:700, color:COLORS.blueprint }}>{fmtPercent(w.sixMonthProgressPercent)}</span>
          </div>
          <div style={{ fontSize:11.5, color:COLORS.ink, lineHeight:2, marginBottom:10 }}>
            <div>کارفرما: {w.client}</div>
            <div>مشاور: {w.consultant}</div>
            <div>پیمانکار: {w.contractor}</div>
            <div>ابلاغ قرارداد: {w.contractDate} · مدت اولیه: {toPersianDigits(w.initialDurationMonths)} ماه</div>
          </div>
          <div style={{ fontSize:11.5, fontWeight:700, color:COLORS.slate, marginBottom:5 }}>فعالیت‌های انجام‌شده (۶ ماه اخیر)</div>
          <div style={{ display:"flex", flexDirection:"column", gap:4, marginBottom:10 }}>
            {w.sixMonthAchievements.map((a,i) => <div key={i} style={{ fontSize:12, color:COLORS.ink }}>• {a}</div>)}
          </div>
          {w.issues.length > 0 && (
            <div style={{ marginBottom:4 }}>
              <div style={{ fontSize:11.5, fontWeight:700, color:COLORS.amber, marginBottom:5 }}>موانع و دلایل تأخیر</div>
              {w.issues.map((iss,i) => <div key={i} style={{ fontSize:12, color:COLORS.ink }}>• {iss}</div>)}
            </div>
          )}
          <CommentsSection sectionKey={`weekly:${w.reportNo}`}/>
        </Card>
      ))}
    </div>
  );
}

function MonthlyTab() {
  return (
    <Card>
      <div style={{ textAlign:"center", color:COLORS.slate, fontSize:13, padding:"20px 0" }}>
        هنوز گزارش ماهانه‌ای ثبت نشده — وقتی اولین فایل ماهانه رو بفرستید، اینجا نمایش داده می‌شه
      </div>
      <CommentsSection sectionKey="monthly"/>
    </Card>
  );
}

function FinancialTab() {
  const w = SEED_WEEKLY[0];
  if (!w) return <Card><div style={{ textAlign:"center", color:COLORS.slate, fontSize:13, padding:"20px 0" }}>هنوز داده مالی ثبت نشده</div></Card>;
  const f = w.financial;
  const rows = [
    ["پیشرفت ریالی پروژه (منتهی به مرداد ۱۴۰۵)", f.rialProgressToMordad1405],
    ["صورت‌وضعیت پیمانکار", f.contractorStatement],
    ["تایید مشاور", f.consultantApproved],
    ["تعدیل تجمعی (خرداد)", f.cumulativeAdjustmentKhordad],
    ["درصد پیشرفت ریالی", fmtPercent(f.percent)],
    ["مطالبات صورت‌وضعیت", f.paidClaimsToOrdibehesht1405],
    ["مطالبات تعدیل", f.paidAdjustmentToFarvardin1405],
  ];
  return (
    <Card>
      <SectionTitle icon={<IconWallet size={14} color={COLORS.green}/>}>وضعیت مالی پروژه</SectionTitle>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {rows.map(([label,val],i) => (
          <div key={i} style={{ display:"flex", justifyContent:"space-between", gap:10, borderBottom:i<rows.length-1?`1px dashed ${COLORS.border}`:"none", paddingBottom:8 }}>
            <span style={{ fontSize:12, color:COLORS.slate }}>{label}</span>
            <span style={{ fontSize:12.5, color:COLORS.ink, fontWeight:700, textAlign:"left" }}>{toPersianDigits(val)}</span>
          </div>
        ))}
      </div>
      <div style={{ fontSize:10.5, color:COLORS.slateLight, marginTop:10 }}>{f.note}</div>
      <CommentsSection sectionKey="financial"/>
    </Card>
  );
}

function IssuesTab() {
  const items = useMemo(() => {
    const list = [];
    for (const r of SEED_DAILY) for (const iss of r.issues) list.push({ text:iss, date:r.dateJalali, source:"گزارش روزانه" });
    for (const w of SEED_WEEKLY) for (const iss of w.issues) list.push({ text:iss, date:w.periodTo, source:`گزارش هفتگی ${toPersianDigits(w.reportNo)}` });
    const grouped = {};
    for (const it of list) {
      if (!grouped[it.text]) grouped[it.text] = { text:it.text, count:0, lastDate:it.date, sources:new Set() };
      grouped[it.text].count += 1; grouped[it.text].lastDate = it.date; grouped[it.text].sources.add(it.source);
    }
    return Object.values(grouped).sort((a,b) => b.count - a.count);
  }, []);
  return (
    <Card>
      <SectionTitle icon={<IconAlert size={14} color={COLORS.amber}/>}>موانع و مسائل باز (تجمیع‌شده)</SectionTitle>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {items.map((it,i) => (
          <div key={i} style={{ borderTop:i>0?`1px solid ${COLORS.paper}`:"none", paddingTop:i>0?8:0 }}>
            <div style={{ fontSize:13, color:COLORS.ink, marginBottom:3 }}>{it.text}</div>
            <div style={{ fontSize:10.5, color:COLORS.slate }}>تکرار: {toPersianDigits(it.count)} بار · آخرین بار: {it.lastDate} · منبع: {[...it.sources].join("، ")}</div>
          </div>
        ))}
      </div>
      <CommentsSection sectionKey="issues"/>
    </Card>
  );
}

function App() {
  const [tab, setTab] = useState("overview");
  const TabContent = { overview:OverviewTab, daily:DailyTab, weekly:WeeklyTab, monthly:MonthlyTab, financial:FinancialTab, issues:IssuesTab }[tab];
  return (
    <div style={{ minHeight:"100vh", background:COLORS.paper, color:COLORS.ink, display:"flex", flexDirection:"column" }}>
      <div style={{ background:COLORS.navy, color:"#fff", padding:"16px 16px 14px" }}>
        <div style={{ fontSize:16, fontWeight:700 }}>کنترل پروژه ایستگاه A6</div>
        <div style={{ fontSize:12, color:COLORS.slateLight, marginTop:3 }}>خط A متروی قم · تاریخ وضعیت: {SEED_WBS.statusDate}</div>
      </div>
      <RulerDivider/>
      <div style={{ display:"flex", overflowX:"auto", background:COLORS.paperWhite, borderBottom:`1px solid ${COLORS.border}` }}>
        {TABS.map(t => {
          const { Icon } = t; const active = tab === t.key;
          return (
            <button key={t.key} onClick={()=>setTab(t.key)}
              style={{ flex:"0 0 auto", display:"flex", flexDirection:"column", alignItems:"center", gap:3, padding:"9px 14px", border:"none", background:"none", borderBottom:active?`2px solid ${COLORS.blueprint}`:"2px solid transparent", color:active?COLORS.blueprint:COLORS.slate, fontWeight:active?700:400, fontSize:11, cursor:"pointer", whiteSpace:"nowrap" }}>
              <Icon size={16}/>{t.label}
            </button>
          );
        })}
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:16, paddingBottom:24 }}>
        <TabContent/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
