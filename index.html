  const map = {0:"۰",1:"۱",2:"۲",3:"۳",4:"۴",5:"۵",6:"۶",7:"۷",8:"۸",9:"۹"};

}

const IconClipboard = p => <IconBase {...p}><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 11h6M9 15h6"/></IconBase>;

const IconCalendarDays = p => <IconBase {...p}><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h.01M12 14h.01M16 14h.01"/></IconBase>;
const IconWallet = p => <IconBase {...p}><path d="M3 7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h3"/></IconBase>;
const IconAlert = p => <IconBase {...p}><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r="0.6" fill={p.color||"currentColor"}/></IconBase>;
const IconChevronDown = p => <IconBase {...p}><path d="M6 9l6 6 6-6"/></IconBase>;

function Card({ children, style }) {

/* ---------------- S-curve (planned vs actual, from weekly PPT) ---------------- */
function SCurveChart({ data }) {
  const w = 300, h = 150, padL = 26, padR = 8, padT = 10, padB = 20;
  const n = data.categories.length;
  const stepX = (w - padL - padR) / (n - 1);
  const toXY = (i, v) => [padL + i * stepX, padT + (h - padT - padB) * (1 - (v || 0))];
  const pathFor = (arr) => {
    let d = "";
    arr.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const [x, y] = toXY(i, v);
      d += (d === "" ? "M" : "L") + x + "," + y + " ";
    });
    return d.trim();
  };
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
      {[0, 0.25, 0.5, 0.75, 1].map((v) => {
        const y = padT + (h - padT - padB) * (1 - v);
        return (
          <g key={v}>
            <line x1={padL} x2={w - padR} y1={y} y2={y} stroke={COLORS.border} strokeDasharray="3 3" />
            <text x={padL - 4} y={y + 3} fontSize="7" fill={COLORS.slate} textAnchor="end">{toPersianDigits(Math.round(v * 100))}</text>
          </g>
        );
      })}
      <path d={pathFor(data.planned)} fill="none" stroke={COLORS.slateLight} strokeWidth="2" strokeDasharray="4 3" />
      <path d={pathFor(data.actual)} fill="none" stroke={COLORS.blueprint} strokeWidth="2.5" />
      {data.categories.map((c, i) => (i % 4 === 0 ? (
        <text key={i} x={padL + i * stepX} y={h - 4} fontSize="7" fill={COLORS.slate} textAnchor="middle">{c}</text>
      ) : null))}
    </svg>
  );
}

/* ---------------- WBS tree (up to 3 levels, collapsible) ---------------- */
function WbsNode({ node, depth }) {
  const [open, setOpen] = useState(depth === 0);
  const hasChildren = node.children && node.children.length > 0;
  const sizes = [13, 12.5, 12];
  const weights = [700, 600, 400];
  return (
    <div style={{ marginRight: depth * 12 }}>
      <div
        onClick={() => hasChildren && setOpen(o => !o)}
        style={{ display: "flex", alignItems: "center", gap: 6, cursor: hasChildren ? "pointer" : "default", padding: "5px 0" }}
      >
        {hasChildren ? (open ? <IconChevronUp size={13} color={COLORS.slate} /> : <IconChevronDown size={13} color={COLORS.slate} />) : <span style={{ width: 13 }} />}
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: sizes[depth] || 11.5, fontWeight: weights[depth] || 400, color: COLORS.ink, marginBottom: 3 }}>
            <span>{node.name}</span>
            <span style={{ color: COLORS.blueprint, fontWeight: 700 }}>{fmtPercent(node.percent)}</span>
          </div>
          <div style={{ height: depth === 0 ? 8 : 6, background: COLORS.paper, borderRadius: 4, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${node.percent || 0}%`, background: depth === 0 ? COLORS.blueprint : COLORS.slateLight, borderRadius: 4 }} />
          </div>
        </div>
      </div>
      {hasChildren && open && (
        <div style={{ borderRight: `1px solid ${COLORS.border}`, marginRight: 6 }}>
          {node.children.map((c, i) => <WbsNode key={i} node={c} depth={depth + 1} />)}
        </div>
      )}
    </div>
  );
}

function IssuesTab() {
  const items = useMemo(() => {
    const list = [];
    for (const r of SEED_DAILY) for (const iss of r.issues) list.push({ text:iss, date:r.dateJalali, source:"گزارش روزانه" });
    for (const w of SEED_WEEKLY) for (const iss of w.issues) list.push({ text:iss, date:w.periodTo, source:`گزارش هفتگی ${toPersianDigits(w.reportNo)}` });
    const grouped = {};
    for (const it of list) {
      if (!grouped[it.text]) grouped[it.text] = { text:it.text, count:0, lastDate:it.date, sources:new Set() };
      grouped[it.text].count += 1; grouped[it.text].lastDate = it.date; grouped[it.text].sources.add(it.source);
    }
    return Object.values(grouped).sort((a,b) => b.count - a.count);
  }, []);
  return (
    <Card>
      <SectionTitle icon={<IconAlert size={14} color={COLORS.amber}/>}>موانع و مسائل باز (تجمیع‌شده)</SectionTitle>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {items.map((it,i) => (
          <div key={i} style={{ borderTop:i>0?`1px solid ${COLORS.paper}`:"none", paddingTop:i>0?8:0 }}>
            <div style={{ fontSize:13, color:COLORS.ink, marginBottom:3 }}>{it.text}</div>
            <div style={{ fontSize:10.5, color:COLORS.slate }}>تکرار: {toPersianDigits(it.count)} بار · آخرین بار: {it.lastDate} · منبع: {[...it.sources].join("، ")}</div>
          </div>
        ))}
      </div>
    </Card>
  );
}

    <div style={{ minHeight:"100vh", background:COLORS.paper, color:COLORS.ink, display:"flex", flexDirection:"column" }}>
      <div style={{ background:COLORS.navy, color:"#fff", padding:"16px 16px 14px" }}>
        <div style={{ fontSize:16, fontWeight:700 }}>کنترل پروژه ایستگاه A6</div>
        <div style={{ fontSize:12, color:COLORS.slateLight, marginTop:3 }}>خط A متروی قم · تاریخ وضعیت: {SEED_WBS.statusDate}</div>

      <RulerDivider/>
      <div style={{ display:"flex", overflowX:"auto", background:COLORS.paperWhite, borderBottom:`1px solid ${COLORS.border}` }}>

            <button key={t.key} onClick={()=>setTab(t.key)}

              <Icon size={16}/>{t.label}

        })}
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:16, paddingBottom:24 }}>
        <TabContent/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
